<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>班會旅行--西貢 Food Hunt & Scavenger Hunt 計分器</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen pb-12">

  <!-- 頂部 Header & 狀態列 -->
  <header class="bg-indigo-600 text-white shadow-md sticky top-0 z-50">
    <div class="max-w-4xl mx-auto px-4 py-3 flex justify-between items-center">
      <div>
        <h1 class="text-xl font-bold">西貢 Food Hunt 計分器</h1>
        <p class="text-xs text-indigo-200">時間: 5/11 11:15 - 14:25 | 班會旅行</p>
      </div>
      <div id="sync-status" class="text-xs px-2.5 py-1 rounded-full bg-indigo-800 text-indigo-200">
        載入中...
      </div>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-4 mt-4 space-y-6">

    <!-- 組別選擇與排行榜 -->
    <section class="bg-white rounded-xl shadow p-4">
      <div class="flex flex-col sm:flex-row justify-between items-center border-b pb-3 mb-4 gap-3">
        <label class="font-bold text-slate-700">選擇目前操作組別：</label>
        <div class="flex gap-2">
          <button onclick="switchTeam(1)" id="btn-team-1" class="px-4 py-1.5 rounded-lg text-sm font-semibold border">第 1 組</button>
          <button onclick="switchTeam(2)" id="btn-team-2" class="px-4 py-1.5 rounded-lg text-sm font-semibold border">第 2 組</button>
          <button onclick="switchTeam(3)" id="btn-team-3" class="px-4 py-1.5 rounded-lg text-sm font-semibold border">第 3 組</button>
        </div>
      </div>

      <!-- 排行榜 -->
      <div class="grid grid-cols-3 gap-2 text-center">
        <div class="bg-indigo-50 border border-indigo-100 rounded-lg p-2">
          <div class="text-xs font-bold text-indigo-600">第 1 組</div>
          <div id="score-team-1" class="text-xl font-extrabold text-indigo-900">0 分</div>
        </div>
        <div class="bg-indigo-50 border border-indigo-100 rounded-lg p-2">
          <div class="text-xs font-bold text-indigo-600">第 2 組</div>
          <div id="score-team-2" class="text-xl font-extrabold text-indigo-900">0 分</div>
        </div>
        <div class="bg-indigo-50 border border-indigo-100 rounded-lg p-2">
          <div class="text-xs font-bold text-indigo-600">第 3 組</div>
          <div id="score-team-3" class="text-xl font-extrabold text-indigo-900">0 分</div>
        </div>
      </div>
    </section>

    <!-- 分頁選單 -->
    <div class="flex border-b border-slate-200 text-sm font-medium text-slate-500">
      <button id="tab-btn-food" onclick="switchTab('food')" class="py-2.5 px-4 border-b-2 border-indigo-600 text-indigo-600 font-bold">
        🍔 Food Hunt 任務
      </button>
      <button id="tab-btn-city" onclick="switchTab('city')" class="py-2.5 px-4 border-b-2 border-transparent hover:text-slate-700">
        🔍 City Scavenger Hunt 任務
      </button>
    </div>

    <!-- Food Hunt 任務容器 -->
    <section id="tab-food" class="space-y-4">
      <div id="food-tasks-list" class="space-y-4"></div>
    </section>

    <!-- Scavenger Hunt 任務容器 -->
    <section id="tab-city" class="space-y-4 hidden">
      <div id="city-tasks-list" class="space-y-3"></div>
    </section>

  </main>

  <!-- 完整的 JavaScript 邏輯 -->
  <script>
    // ⚠️ 請填入你的真實 Firebase Config
    const firebaseConfig = {
      apiKey: "AIzaSyCCQcjbqig5_QvJafTtE9mxcoMS3tOFi2s",
      authDomain: "foodhuntcal.firebaseapp.com",
      projectId: "foodhuntcal",
      storageBucket: "foodhuntcal.firebasestorage.app",
      messagingSenderId: "279379228545",
      appId: "1:279379228545:web:a5c0576b267845dccbda80"
    };

    let db = null;
    let isCloudActive = false;
    let currentTeam = 1;

    let store = {
      team1: { food: {}, city: {} },
      team2: { food: {}, city: {} },
      team3: { food: {}, city: {} }
    };

    const foodTasks = [
      { id: "kung_kung", title: "Kung Kung Kiosk (海濱公園)", rec: "Banoffee Pie", price: "$48", basePts: 200, extraDesc: "+100分 (全組模仿鴨子打卡)", hasExtraCheck: true },
      { id: "chill_chill", title: "Chill Chill at 449 (福民路)", rec: "「必食」系列", price: "$12-42", basePts: 200, customType: "chill" },
      { id: "yogurt", title: "小滿定律 (福民路)", rec: "乳酪雪糕", price: "$58", basePts: 200, customType: "yogurt" },
      { id: "french", title: "法國佬烘焙店 (福民路)", rec: "自家製曲奇/可麗露", price: "$40-50", basePts: 200, customType: "french" },
      { id: "paisano", title: "Paisano's Pizzeria (福民路)", rec: "超大片 Pizza", price: "$25-45", basePts: 100, extraDesc: "+300分 (主席猜不出Pizza背後的人)", hasExtraCheck: true },
      { id: "offbeat", title: "Offbeat (市場街)", rec: "Creme Caramel", price: "$55", basePts: 500, customType: "offbeat" },
      { id: "sleepless", title: "Sleepless (市場街)", rec: "抹茶系列甜品", price: "$78-108", basePts: 300 },
      { id: "little_cove", title: "Little Cove Espresso (西貢碼頭)", rec: "法式西多士", price: "$112", basePts: 200 },
      { id: "sai_kung_cafe", title: "Sai Kung Cafe & Bakery (西貢碼頭)", rec: "菠蘿包/葡撻等", price: "$16-18", basePts: 200, customType: "bakery" },
      { id: "chairman", title: "尋人啟事!!", rec: "尋找主席蹤影並合照", price: "$0", basePts: 600 }
    ];

    const cityTasks = [
      { id: "vending", title: "自動販賣機", basePts: 50, extraDesc: "+200分 (售賣Pokemon card)", hasExtraCheck: true },
      { id: "trash", title: "垃圾桶 (保持距離合照)", basePts: 50 },
      { id: "water_craft", title: "人力推動水上交通 (獨木舟/直立板)", basePts: 100, extraDesc: "+200分 (不在水中)", hasExtraCheck: true },
      { id: "animal", title: "動物畫像 (不含人類)", basePts: 300 },
      { id: "hotel", title: "酒店 (必須標明 Hotel)", basePts: 300 },
      { id: "water_gun", title: "水槍", basePts: 150 },
      { id: "tesla", title: "Tesla 私家車", basePts: 150 },
      { id: "school", title: "學校", basePts: 100, allowMultiple: true },
      { id: "sports", title: "政府體育設施", basePts: 100, allowMultiple: true },
      { id: "slide", title: "滑梯", basePts: 150, allowMultiple: true },
      { id: "seven", title: "7-11便利店", basePts: 100, allowMultiple: true },
      { id: "seafood_live", title: "活海鮮", basePts: 200, extraDesc: "+400分 (不在酒樓魚缸)", hasExtraCheck: true },
      { id: "supermarket", title: "超市", basePts: 100, allowMultiple: true },
      { id: "claw", title: "夾公仔機", basePts: 200 },
      { id: "barber", title: "剪髮舖", basePts: 150, allowMultiple: true },
      { id: "church", title: "教會", basePts: 300 },
      { id: "realty", title: "地產商", basePts: 100, allowMultiple: true },
      { id: "bank", title: "銀行", basePts: 100, allowMultiple: true },
      { id: "starbucks", title: "Starbucks", basePts: 150 },
      { id: "arch", title: "海鮮街牌坊", basePts: 100 }
    ];

    function switchTab(tab) {
      if (tab === 'food') {
        document.getElementById('tab-food').classList.remove('hidden');
        document.getElementById('tab-city').classList.add('hidden');
        document.getElementById('tab-btn-food').className = "py-2.5 px-4 border-b-2 border-indigo-600 text-indigo-600 font-bold";
        document.getElementById('tab-btn-city').className = "py-2.5 px-4 border-b-2 border-transparent text-slate-500";
      } else {
        document.getElementById('tab-food').classList.add('hidden');
        document.getElementById('tab-city').classList.remove('hidden');
        document.getElementById('tab-btn-city').className = "py-2.5 px-4 border-b-2 border-indigo-600 text-indigo-600 font-bold";
        document.getElementById('tab-btn-food').className = "py-2.5 px-4 border-b-2 border-transparent text-slate-500";
      }
    }

    function switchTeam(team) {
      currentTeam = team;
      [1, 2, 3].forEach(t => {
        const btn = document.getElementById(`btn-team-${t}`);
        if (t === team) {
          btn.className = "px-4 py-1.5 rounded-lg text-sm font-bold bg-indigo-600 text-white shadow";
        } else {
          btn.className = "px-4 py-1.5 rounded-lg text-sm font-semibold bg-slate-100 text-slate-600 border border-slate-300";
        }
      });
      renderTasks();
    }

    function init() {
      switchTeam(1);
      renderTasks();

      try {
        if (firebaseConfig.apiKey && firebaseConfig.apiKey !== "YOUR_FIREBASE_API_KEY") {
          firebase.initializeApp(firebaseConfig);
          db = firebase.firestore();
          isCloudActive = true;
        }
      } catch (e) {
        console.warn("Firebase 初始化失敗：", e);
        isCloudActive = false;
      }

      if (isCloudActive) {
        const timer = setTimeout(() => {
          fallbackToLocal();
        }, 3000);

        db.collection("events").doc("saikung2026").onSnapshot(doc => {
          clearTimeout(timer);
          updateStatusUI(true);
          if (doc.exists) {
            store = doc.data();
            updateAllScoresUI();
            renderTasks();
          } else {
            saveData();
          }
        }, err => {
          clearTimeout(timer);
          fallbackToLocal();
        });
      } else {
        fallbackToLocal();
      }
    }

    function fallbackToLocal() {
      isCloudActive = false;
      const saved = localStorage.getItem("saikung_foodhunt_data");
      if (saved) store = JSON.parse(saved);
      updateStatusUI(false);
      updateAllScoresUI();
      renderTasks();
    }

    function updateStatusUI(isCloud) {
      const el = document.getElementById("sync-status");
      if (isCloud) {
        el.className = "text-xs px-2.5 py-1 rounded-full bg-emerald-500 text-white font-semibold";
        el.innerText = "☁️ 實時雲端同步中";
      } else {
        el.className = "text-xs px-2.5 py-1 rounded-full bg-amber-500 text-white font-semibold";
        el.innerText = "💾 單機自動保存中";
      }
    }

    function saveData() {
      if (isCloudActive) {
        db.collection("events").doc("saikung2026").set(store);
      } else {
        localStorage.setItem("saikung_foodhunt_data", JSON.stringify(store));
        updateAllScoresUI();
      }
    }

    function renderTasks() {
      const foodContainer = document.getElementById("food-tasks-list");
      if (!foodContainer) return;
      foodContainer.innerHTML = foodTasks.map(t => {
        const data = ((store[`team${currentTeam}`] || {}).food || {})[t.id] || {};
        return `
          <div class="border border-slate-200 rounded-xl p-4 bg-white shadow-sm space-y-2">
            <div class="flex justify-between items-start">
              <div>
                <h3 class="font-bold text-slate-800">${t.title}</h3>
                <p class="text-xs text-indigo-600 font-medium">推薦：${t.rec} (${t.price})</p>
              </div>
              <label class="flex items-center space-x-2 bg-slate-50 border px-3 py-1.5 rounded-lg cursor-pointer">
                <input type="checkbox" ${data.completed ? 'checked' : ''} onchange="toggleTask('food', '${t.id}', 'completed', this.checked)" class="w-4 h-4 text-indigo-600 rounded">
                <span class="text-xs font-bold text-slate-700">完成 (+${t.basePts})</span>
              </label>
            </div>
            ${renderFoodCustomInputs(t, data)}
          </div>
        `;
      }).join('');

      const cityContainer = document.getElementById("city-tasks-list");
      if (!cityContainer) return;
      cityContainer.innerHTML = cityTasks.map(t => {
        const data = ((store[`team${currentTeam}`] || {}).city || {})[t.id] || {};
        return `
          <div class="border border-slate-200 rounded-xl p-3 bg-white shadow-sm flex justify-between items-center">
            <div>
              <div class="font-bold text-slate-800 text-sm">${t.title}</div>
              <div class="text-xs text-slate-500">基礎分: ${t.basePts} 分</div>
              ${t.extraDesc ? `<div class="text-xs text-amber-600 font-medium">${t.extraDesc}</div>` : ''}
            </div>
            <div class="flex items-center gap-3">
              ${t.allowMultiple ? `
                <div class="flex items-center space-x-1 border rounded-lg overflow-hidden">
                  <button onclick="changeCount('${t.id}', -1)" class="px-2.5 py-1 bg-slate-100 font-bold text-slate-600">-</button>
                  <span class="px-2 font-bold text-sm text-indigo-600">${data.count || 0}</span>
                  <button onclick="changeCount('${t.id}', 1)" class="px-2.5 py-1 bg-slate-100 font-bold text-slate-600">+</button>
                </div>
              ` : `
                <input type="checkbox" ${data.completed ? 'checked' : ''} onchange="toggleTask('city', '${t.id}', 'completed', this.checked)" class="w-5 h-5 text-indigo-600 rounded">
              `}
              ${t.hasExtraCheck ? `
                <label class="text-xs flex items-center space-x-1 bg-amber-50 text-amber-800 border border-amber-200 px-2 py-1 rounded cursor-pointer">
                  <input type="checkbox" ${data.extra ? 'checked' : ''} onchange="toggleTask('city', '${t.id}', 'extra', this.checked)" class="w-3.5 h-3.5">
                  <span>加分項</span>
                </label>
              ` : ''}
            </div>
          </div>
        `;
      }).join('');
    }

    function renderFoodCustomInputs(t, data) {
      let html = '';
      if (t.hasExtraCheck) {
        html += `
          <label class="flex items-center space-x-2 text-xs text-amber-800 bg-amber-50 p-2 rounded border border-amber-200 cursor-pointer">
            <input type="checkbox" ${data.extra ? 'checked' : ''} onchange="toggleTask('food', '${t.id}', 'extra', this.checked)" class="w-4 h-4 text-amber-600 rounded">
            <span>${t.extraDesc}</span>
          </label>
        `;
      }
      if (t.customType === 'chill') {
        html += `
          <div class="text-xs space-y-1 bg-slate-50 p-2 rounded border">
            <div>額外加分：每快 449 秒 1 分鐘吃完 +100分 (最多2次)</div>
            <select onchange="setTaskVal('food', '${t.id}', 'chillExtra', this.value)" class="border rounded p-1 text-xs">
              <option value="0" ${data.chillExtra == 0 ? 'selected' : ''}>無額外加分</option>
              <option value="1" ${data.chillExtra == 1 ? 'selected' : ''}>快 1 分鐘 (+100)</option>
              <option value="2" ${data.chillExtra == 2 ? 'selected' : ''}>快 2 分鐘或以上 (+200)</option>
            </select>
          </div>
        `;
      }
      if (t.customType === 'yogurt') {
        html += `
          <div class="text-xs space-y-1 bg-slate-50 p-2 rounded border">
            <div>乳酪配料顏色數（超過3種每多1種+50分，最多2次）：</div>
            <select onchange="setTaskVal('food', '${t.id}', 'yogurtExtra', this.value)" class="border rounded p-1 text-xs">
              <option value="0" ${data.yogurtExtra == 0 ? 'selected' : ''}>3種或以下 (無加分)</option>
              <option value="1" ${data.yogurtExtra == 1 ? 'selected' : ''}>4種顏色 (+50分)</option>
              <option value="2" ${data.yogurtExtra == 2 ? 'selected' : ''}>5種顏色或以上 (+100分)</option>
            </select>
          </div>
        `;
      }
      if (t.customType === 'french') {
        html += `
          <div class="text-xs space-y-1 bg-slate-50 p-2 rounded border">
            <label>法語發音準確度 (超過50%後每 1% +10分)：</label>
            <div class="flex items-center space-x-2">
              <input type="number" min="0" max="100" value="${data.frenchAcc || 0}" onchange="setTaskVal('food', '${t.id}', 'frenchAcc', this.value)" class="w-16 border rounded p-1 text-xs">
              <span>%</span>
            </div>
          </div>
        `;
      }
      if (t.customType === 'offbeat') {
        html += `
          <div class="text-xs space-y-1 bg-slate-50 p-2 rounded border">
            <div>數拍子挑戰：全組額外成功人數 (每多一人 +100分)：</div>
            <input type="number" min="0" max="10" value="${data.offbeatCount || 0}" onchange="setTaskVal('food', '${t.id}', 'offbeatCount', this.value)" class="w-16 border rounded p-1 text-xs">
          </div>
        `;
      }
      if (t.customType === 'bakery') {
        html += `
          <div class="text-xs space-y-1 bg-slate-50 p-2 rounded border">
            <div>額外嘗試推薦食品並給出1分鐘食評（每多一種 +100分，最多3次）：</div>
            <input type="number" min="0" max="3" value="${data.bakeryCount || 0}" onchange="setTaskVal('food', '${t.id}', 'bakeryCount', this.value)" class="w-16 border rounded p-1 text-xs">
          </div>
        `;
      }
      return html;
    }

    function toggleTask(type, id, key, checked) {
      const teamKey = `team${currentTeam}`;
      if (!store[teamKey][type]) store[teamKey][type] = {};
      if (!store[teamKey][type][id]) store[teamKey][type][id] = {};
      store[teamKey][type][id][key] = checked;
      saveData();
    }

    function setTaskVal(type, id, key, val) {
      const teamKey = `team${currentTeam}`;
      if (!store[teamKey][type]) store[teamKey][type] = {};
      if (!store[teamKey][type][id]) store[teamKey][type][id] = {};
      store[teamKey][type][id][key] = Number(val);
      saveData();
    }

    function changeCount(id, delta) {
      const teamKey = `team${currentTeam}`;
      if (!store[teamKey].city) store[teamKey].city = {};
      if (!store[teamKey].city[id]) store[teamKey].city[id] = { count: 0 };
      let curr = store[teamKey].city[id].count || 0;
      curr = Math.max(0, curr + delta);
      store[teamKey].city[id].count = curr;
      renderTasks();
      saveData();
    }

    function calcTeamScore(teamNum) {
      const data = store[`team${teamNum}`] || { food: {}, city: {} };
      let total = 0;

      foodTasks.forEach(t => {
        const item = (data.food || {})[t.id];
        if (item && item.completed) {
          total += t.basePts;
          if (t.hasExtraCheck && item.extra) total += (t.id === 'paisano' ? 300 : 100);
          if (t.customType === 'chill') total += (item.chillExtra || 0) * 100;
          if (t.customType === 'yogurt') total += (item.yogurtExtra || 0) * 50;
          if (t.customType === 'french' && item.frenchAcc > 50) {
            total += Math.floor(item.frenchAcc - 50) * 10;
          }
          if (t.customType === 'offbeat') total += (item.offbeatCount || 0) * 100;
          if (t.customType === 'bakery') total += Math.min(3, item.bakeryCount || 0) * 100;
        }
      });

      cityTasks.forEach(t => {
        const item = (data.city || {})[t.id];
        if (item) {
          if (t.allowMultiple) {
            total += (item.count || 0) * t.basePts;
          } else if (item.completed) {
            total += t.basePts;
            if (t.hasExtraCheck && item.extra) {
              total += (t.id === 'seafood_live' ? 400 : 200);
            }
          }
        }
      });

      return total;
    }

    function updateAllScoresUI() {
      [1, 2, 3].forEach(t => {
        const el = document.getElementById(`score-team-${t}`);
        if (el) el.innerText = `${calcTeamScore(t)} 分`;
      });
    }

    window.onload = init;
  </script>
</body>
</html>
